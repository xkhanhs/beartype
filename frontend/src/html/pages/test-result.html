<!--
  beartype: keybear's result screen -- two big figures, two small ones, the
  buttons, then the book of recent tests. Upstream's chart over time, raw
  speed, character counts, consistency, input history and replay are gone.
  The last three of those stay in the page, hidden for good at the bottom:
  test-ui.ts, replay-ui.ts and chart-controller.ts look them up once, when
  they load, and stop the app if they are missing.
-->
<div id="result" class="content-grid full-width hidden" tabindex="-1">
  <div class="wrapper">
    <div class="stats">
      <div class="group wpm">
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
        <div class="top">
          <div class="text">wpm</div>
          <div
            class="crown hidden"
            aria-label=""
            data-balloon-pos="up"
            data-balloon-length="medium"
          >
            <i class="fas fa-question"></i>
            <i class="fas fa-crown"></i>
            <i class="fas fa-slash"></i>
            <i class="fas fa-exclamation-triangle"></i>
          </div>
        </div>
      </div>
      <div class="group acc">
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
        <div class="top">chính xác</div>
      </div>
    </div>
    <div class="stats morestats">
      <div class="group words">
        <div class="bottom">-</div>
        <div class="top">số từ</div>
      </div>
      <div class="group time">
        <div class="bottom" aria-label="" data-balloon-pos="up">
          <div class="text">-</div>
        </div>
        <div class="top">thời gian</div>
      </div>
    </div>
    <div class="stats notes">
      <div class="group info hidden">
        <div class="bottom">-</div>
      </div>
    </div>
    <div class="buttons">
      <button
        class="text bt-action bt-action-primary"
        id="nextTestButton"
        aria-label="bài mới · phím tắt: tab rồi enter"
        data-balloon-pos="down"
      >
        <i class="fas fa-fw fa-chevron-right"></i>
        <span>bài mới</span>
      </button>
      <button class="text bt-action" id="restartTestButtonWithSameWordset">
        <i class="fas fa-fw fa-sync-alt"></i>
        <span>gõ lại</span>
      </button>
      <mount data-component="missdrill" class="contents"></mount>
    </div>
    <mount data-component="resulthistory"></mount>

    <div class="bt-unused" hidden aria-hidden="true">
      <div class="chart">
        <canvas id="wpmChart"></canvas>
      </div>
      <div id="resultWordsHistory" class="hidden">
        <div class="words"></div>
      </div>
      <div id="resultReplay" class="hidden">
        <p id="replayStats">0s</p>
        <div id="replayWordsWrapper">
          <div id="replayWords" class="words"></div>
        </div>
      </div>
    </div>
  </div>
</div>
