<!--
  keybear's result screen: two big figures, two small ones, the buttons,
  then the book of recent tests.
-->
<div id="result" class="content-grid full-width hidden" tabindex="-1">
  <div class="wrapper">
    <div class="stats">
      <div class="group wpm">
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
        <div class="top">
          <div class="text">wpm</div>
          <div class="crown hidden" aria-label="" data-balloon-pos="up">
            <i class="fas fa-crown"></i>
          </div>
        </div>
      </div>
      <div class="group acc">
        <div class="bottom" aria-label="" data-balloon-pos="up">-</div>
        <div class="top">chính xác</div>
      </div>
    </div>
    <div class="stats morestats">
      <div class="group words">
        <div class="bottom">-</div>
        <div class="top">số từ</div>
      </div>
      <div class="group time">
        <div class="bottom" aria-label="" data-balloon-pos="up">
          <div class="text">-</div>
        </div>
        <div class="top">thời gian</div>
      </div>
    </div>
    <div class="stats notes">
      <div class="group info hidden">
        <div class="bottom">-</div>
      </div>
    </div>
    <div class="buttons">
      <button
        class="text bt-action bt-action-primary"
        id="nextTestButton"
        aria-label="phím tắt: tab + enter"
        data-balloon-pos="down"
      >
        <!-- beartype: keybear's icons, Material Design Icons (Apache-2.0):
             chevron-right, restart; target is in MissDrillButton.tsx -->
        <svg class="bt-action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"
          />
        </svg>
        <span>bài mới</span>
      </button>
      <button class="text bt-action" id="restartTestButtonWithSameWordset">
        <svg class="bt-action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12,4C14.1,4 16.1,4.8 17.6,6.3C20.7,9.4 20.7,14.5 17.6,17.6C15.8,19.5 13.3,20.2 10.9,19.9L11.4,17.9C13.1,18.1 14.9,17.5 16.2,16.2C18.5,13.9 18.5,10.1 16.2,7.7C15.1,6.6 13.5,6 12,6V10.6L7,5.6L12,0.6V4M6.3,17.6C3.7,15 3.3,11 5.1,7.9L6.6,9.4C5.5,11.6 5.9,14.4 7.8,16.2C8.3,16.7 8.9,17.1 9.6,17.4L9,19.4C8,19 7.1,18.4 6.3,17.6Z"
          />
        </svg>
        <span>gõ lại bài này</span>
      </button>
      <mount data-component="missdrill" class="contents"></mount>
    </div>
    <mount data-component="resulthistory"></mount>
  </div>
</div>
