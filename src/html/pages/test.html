<div class="page pageTest full-width content-grid hidden" data-nosnippet>
  <mount data-component="testconfig" class="full-width"></mount>

  <div id="testInitFailed" class="content-grid hidden">
    <div class="message">
      <!-- beartype: test-logic writes the reason into .text; data-i18n is
           the language of the page, in beartype/dom-strings.ts -->
      <div class="text" data-i18n="buildFailed">Không dựng được bài gõ.</div>
      <div class="error hidden"></div>
      <button class="text bt-action bt-action-primary restart">
        <svg class="bt-action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12,4C14.1,4 16.1,4.8 17.6,6.3C20.7,9.4 20.7,14.5 17.6,17.6C15.8,19.5 13.3,20.2 10.9,19.9L11.4,17.9C13.1,18.1 14.9,17.5 16.2,16.2C18.5,13.9 18.5,10.1 16.2,7.7C15.1,6.6 13.5,6 12,6V10.6L7,5.6L12,0.6V4M6.3,17.6C3.7,15 3.3,11 5.1,7.9L6.6,9.4C5.5,11.6 5.9,14.4 7.8,16.2C8.3,16.7 8.9,17.1 9.6,17.4L9,19.4C8,19 7.1,18.4 6.3,17.6Z"
          />
        </svg>
        <span data-i18n="restart">gõ lại</span>
      </button>
    </div>
  </div>
  <div id="typingTest" class="content-grid full-width-padding">
    <mount data-component="capswarning"></mount>
    <mount data-component="testmodesnotice"></mount>

    <mount data-component="livestatsmini" class="full-width"></mount>
    <div id="wordsWrapper" class="content-grid full-width" translate="no">
      <textarea
        id="wordsInput"
        class="full-width"
        autocomplete="off"
        autocapitalize="off"
        autocapitalize="none"
        autocorrect="off"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        data-bwignore
        data-1p-ignore
        data-lpignore="true"
        data-form-type="other"
        list="autocompleteOff"
        spellcheck="false"
      ></textarea>
      <mount data-component="outoffocuswarning" class="contents"></mount>
      <div id="caret" class="full-width default"></div>
      <!-- beartype: the pace to type against, off unless someone asks for it -->
      <div id="paceCaret" class="full-width default hidden"></div>
      <div id="words" class="full-width"></div>
    </div>

    <mount data-component="keymap"></mount>

    <div class="testButtons">
      <button
        id="restartTestButton"
        class="text bt-action bt-action-bare"
        aria-label="bài mới · tab + enter"
        data-i18n-label="newTestHint"
        data-balloon-pos="down"
      >
        <!-- beartype: keybear's chevron-right, Material Design Icons -->
        <svg class="bt-action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"
          />
        </svg>
      </button>
      <mount data-component="missdrill" class="contents"></mount>
      <mount data-component="slowdrill" class="contents"></mount>
    </div>
  </div>
  <div class="loading hidden">
    <svg class="bt-icon bt-spin" aria-hidden="true">
      <use href="#i-loader-circle"></use>
    </svg>
  </div>
  <load src="./test-result.html" />
</div>
